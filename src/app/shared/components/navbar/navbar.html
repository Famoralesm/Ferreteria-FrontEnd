<header class="navbar">



  <div class="right">

    <div class="notification">

      <i class="pi pi-bell"></i>

      <p-badge value="3"></p-badge>

    </div>

    <ng-container *ngIf="currentUser$ | async as user">

      <div class="user">

        <button
          type="button"
          class="user-trigger"
          aria-label="Abrir opciones de usuario"
          (click)="profileMenu.toggle($event)">

          <p-avatar
            [image]="avatarImage(user.avatarUrl)"
            [label]="user.avatarUrl ? undefined : initials(user.name)"
            [icon]="user.avatarUrl ? undefined : 'pi pi-user'"
            shape="circle">
          </p-avatar>

          <span class="user-details">

            <strong>{{ user.name }}</strong>

            <small>{{ roleLabel(user.role) }}</small>

            <small>{{ user.email }}</small>

          </span>

          <i class="pi pi-angle-down"></i>

        </button>

        <p-menu
          #profileMenu
          [model]="profileItems"
          [popup]="true"
          appendTo="body">
        </p-menu>

      </div>

    </ng-container>

  </div>

</header>
