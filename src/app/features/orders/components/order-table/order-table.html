<p-table [value]="orders" [paginator]="true" [rows]="7">
  <ng-template pTemplate="header">
    <tr>
      <th>#</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Tiempo</th><th>Fecha</th><th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-order>
    <tr>
      <td>{{ order.id }}</td>
      <td>{{ order.cliente }}</td>
      <td>{{ order.total | currency:'CLP':'symbol':'1.0-0':'es-CL' }}</td>
      <td><div class="status-badge" [ngClass]="getStatusColor(order)">{{ order.estado }}</div></td>
      <td><div class="status-timer"><i class="pi pi-clock"></i>{{ getElapsedTime(order) }}</div></td>
      <td>{{ order.fecha | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>
        <button pButton icon="pi pi-eye" severity="info" rounded aria-label="Ver pedido" (click)="view.emit(order.id)"></button>
        <button pButton icon="pi pi-pencil" severity="warn" rounded aria-label="Editar pedido" (click)="edit.emit(order.id)"></button>
        <button pButton icon="pi pi-print" severity="help" rounded aria-label="Imprimir pedido" (click)="print.emit(order.id)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
