<div class="page-shell">

  <div class="page-header">

    <div class="page-header-content">

      <span class="page-kicker">
        PEDIDOS
      </span>

      <p>
        Administración y seguimiento de pedidos
      </p>

    </div>

  </div>

  <!-- BUSCADOR -->
  <div class="order-tools">

    <app-order-toolbar
      (searchChange)="onSearchChange($event)">
    </app-order-toolbar>

  </div>

  <!-- TABLA -->
  <div class="page-card">

    <app-order-table
      [orders]="(filteredOrders$ | async) ?? []"
      (edit)="edit($event)"
      (view)="view($event)"
      (delete)="delete($event)"
      (duplicate)="duplicate($event)"
      (print)="print($event)">
    </app-order-table>

  </div>

  <!-- BOTÓN DEBAJO DE LA TABLA -->
  <div class="page-footer-actions">

    <button
      pButton
      type="button"
      icon="pi pi-plus"
      label="Nuevo Pedido"
      (click)="newOrder()">
    </button>

  </div>

</div>
