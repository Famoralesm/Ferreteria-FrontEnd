<div class="page-shell">

  <div class="page-header">

    <div class="page-header-content">

      <span class="page-kicker">
        PEDIDOS
      </span>

  
      <p>
        Administración y seguimiento de pedidos
      </p>

    </div>

  </div>

  <div class="order-tools">

    <app-order-toolbar></app-order-toolbar>


  </div>

  <div class="page-card">

    <app-order-table
      [orders]="orders"
      (edit)="edit($event)"
      (view)="view($event)"
      (delete)="delete($event)"
      (duplicate)="duplicate($event)"
      (print)="print($event)">
    </app-order-table>

  </div>

  <!-- Acción debajo de la tabla -->
  <div class="page-footer-actions">

    <button
      pButton
      type="button"
      icon="pi pi-plus"
      label="Nuevo Pedido"
      (click)="newOrder()">
    </button>

  </div>

</div>
