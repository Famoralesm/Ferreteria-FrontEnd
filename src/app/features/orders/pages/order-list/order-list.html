<div class="page-shell">
  <div class="page-header">
    <div class="page-header-content">
      <span class="page-kicker">PEDIDOS</span>
      <p>Administración y seguimiento de pedidos</p>
    </div>
  </div>

  @if (filteredOrders$ | async; as filteredOrders) {
    <div class="order-tools">
      <app-order-toolbar (searchChange)="onSearchChange($event)"></app-order-toolbar>
      <div class="page-info order-total">
        <i class="pi pi-shopping-cart"></i>
        <span>Total de pedidos: <strong>{{ filteredOrders.length }}</strong></span>
      </div>
    </div>

    <div class="page-card">
      <app-order-table
        [orders]="filteredOrders"
        (edit)="edit($event)"
        (view)="view($event)"
        (print)="print($event)">
      </app-order-table>
    </div>
  }

  <div class="page-footer-actions">
    <button pButton type="button" icon="pi pi-plus" label="Nuevo Pedido" (click)="newOrder()"></button>
  </div>
</div>
