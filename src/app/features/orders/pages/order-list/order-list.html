<div class="page-shell">

  <div class="page-header">

    <div class="page-header-content">

      <span class="page-kicker">
        PEDIDOS
      </span>

      <h1>
        Pedidos
      </h1>

      <p>
        Administración y seguimiento de pedidos
      </p>

    </div>

  </div>


  <div class="order-tools">

    <app-order-toolbar></app-order-toolbar>

    <app-order-filter></app-order-filter>

  </div>


  <div class="page-card">

    <app-order-table

      [orders]="orders"

      (edit)="edit($event)"
      (view)="view($event)"
      (delete)="delete($event)"
      (duplicate)="duplicate($event)"
      (print)="print($event)">

    </app-order-table>

  </div>

</div>
