<div class="page-shell">

  <div class="page-header">

    <div class="page-header-content">

      <span class="page-kicker">
        PRODUCTOS
      </span>

      <p>
        Administración del catálogo e inventario
      </p>

    </div>

  </div>

  <div class="page-info">

    <i class="pi pi-box"></i>

    <span>
      Total de productos:
      <strong>{{ products.length }}</strong>
    </span>

  </div>

  <div class="page-card">

    <app-product-table
      [products]="products"
      (edit)="edit($event)"
      (view)="view($event)"
      (delete)="delete($event)">
    </app-product-table>

  </div>

  <!-- ACCIONES DE PRODUCTOS -->
  <div class="page-actions page-actions--bottom">

    <button
      pButton
      type="button"
      label="Nuevo Producto"
      icon="pi pi-plus"
      severity="success"
      (click)="newProduct()">
    </button>

  </div>

</div>
